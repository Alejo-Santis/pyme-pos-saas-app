###############################################################################
# ColSaaS ERP — Docker Compose
#
# Para desarrollo local con Docker:
#   1. Copiar .env.docker → .env
#   2. docker compose up -d
#   3. docker compose exec app php artisan migrate
#   4. docker compose exec app php artisan db:seed
#
# Para Laragon local (sin Docker):
#   Usar el .env por defecto con DB_HOST=127.0.0.1
###############################################################################

services:

  # ─── PHP-FPM (Laravel) ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    container_name: colsaas_app
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - colsaas_network
    restart: unless-stopped

  # ─── Nginx ────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: colsaas_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - colsaas_network
    restart: unless-stopped

  # ─── Vite (HMR en desarrollo) ─────────────────────────────────────────────
  vite:
    image: node:22-alpine
    container_name: colsaas_vite
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - colsaas_network
    restart: unless-stopped

  # ─── PostgreSQL 16 ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: colsaas_postgres
    environment:
      POSTGRES_DB: nextpossaas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"           # puerto 5433 en host para no chocar con Laragon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - colsaas_network
    restart: unless-stopped

  # ─── Redis 7 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: colsaas_redis
    ports:
      - "6380:6379"           # puerto 6380 en host para no chocar con Redis local
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - colsaas_network
    restart: unless-stopped

  # ─── Laravel Horizon (colas) ──────────────────────────────────────────────
  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    container_name: colsaas_horizon
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    command: php artisan horizon
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - colsaas_network
    restart: unless-stopped

  # ─── Mailpit (emails en desarrollo) ──────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: colsaas_mailpit
    ports:
      - "1025:1025"           # SMTP
      - "8025:8025"           # UI web → http://localhost:8025
    networks:
      - colsaas_network
    restart: unless-stopped

# ─── Redes ──────────────────────────────────────────────────────────────────
networks:
  colsaas_network:
    driver: bridge

# ─── Volúmenes ──────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
